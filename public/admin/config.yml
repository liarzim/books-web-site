backend:
  name: github
  # TODO: replace with the real "owner/repo-name" this site is deployed from.
  repo: your-org/books-web-site
  branch: main
  # TODO: replace with this site's deployed origin (no trailing slash).
  # The GitHub OAuth App's callback URL must be "<base_url>/api/callback".
  base_url: https://your-deployed-site.example.com
  auth_endpoint: api/auth

# Static site: Decap commits Markdown straight to the repo; Vercel then
# rebuilds and redeploys automatically on every push to the branch above.
publish_mode: simple

media_folder: "public/images/books"
public_folder: "/images/books"

collections:
  - name: "books"
    label: "Books"
    label_singular: "Book"
    folder: "content/books"
    create: true
    delete: true
    # Names the file at content/books/<slug>.md when an entry is first
    # created. Editing the Slug field on an existing entry afterwards does
    # NOT rename the file or change the live URL -- see the field hint.
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Language"
        name: "language"
        widget: "select"
        default: "en"
        options:
          - { label: "English", value: "en" }
          - { label: "Hebrew", value: "he" }

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Sets the filename/URL when this entry is first created (content/books/<slug>.md). Changing it later does not rename the file."

      - label: "Cover Image"
        name: "coverImage"
        widget: "image"
        required: false

      - label: "Table of Contents"
        name: "toc"
        widget: "list"
        required: false
        label_singular: "Link"
        summary: "{{fields.label}}"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - label: "Anchor"
            name: "anchor"
            widget: "string"
            hint: "Heading id to jump to, without the leading #"

      - label: "Body"
        name: "body"
        widget: "markdown"

      # Kept from the existing content model so editing through the CMS
      # never silently drops these values -- Decap only writes the
      # frontmatter keys it knows about back to the file.
      - { label: "Author", name: "author", widget: "string" }
      - label: "Published Year"
        name: "publishedYear"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        required: false
